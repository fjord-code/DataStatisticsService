services:
  data-statistics:
    build:
      context: ./server
      dockerfile: src/DataStatisticsService.Host/Dockerfile
    container_name: data-statistics
    ports:
      - "${STATISTICS_PORT}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__StatisticsDb=Host=statistics-postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASS}
      - RabbitMQ__ExchangeName=${RABBITMQ_EXCHANGE}
      - RabbitMQ__QueueName=${RABBITMQ_QUEUE}
      - RabbitMQ__QueueKey=${RABBITMQ_QUEUE_KEY}
      - RabbitMQ__StatisticsUpdatesExchange=${RABBITMQ_STATISTICS_UPDATES_EXCHANGE}
      - RabbitMQ__StatisticsUpdatesQueue=${RABBITMQ_STATISTICS_UPDATES_QUEUE}
    depends_on:
      statistics-postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  data-statistics-gateway:
    build:
      context: ./server
      dockerfile: src/DataStatisticsService.Gateway.Host/Dockerfile
    container_name: data-statistics-gateway
    ports:
      - "${GATEWAY_PORT}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__StatisticsDb=Host=statistics-postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      statistics-postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  data-statistics-notification:
    build:
      context: ./server
      dockerfile: src/DataStatisticsService.Notification.Host/Dockerfile
    container_name: data-statistics-notification
    ports:
      - "${NOTIFICATION_PORT}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:8080
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASS}
      - RabbitMQ__StatisticsUpdatesExchange=${RABBITMQ_STATISTICS_UPDATES_EXCHANGE}
      - RabbitMQ__StatisticsUpdatesQueue=${RABBITMQ_STATISTICS_UPDATES_QUEUE}
      - Cors__Origins__0=http://localhost:${FRONTEND_PORT}
    networks:
      - app-network
    restart: unless-stopped

  data-statistics-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: data-statistics-frontend
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - data-statistics-gateway
      - data-statistics-notification
    networks:
      - app-network
    restart: unless-stopped

  statistics-postgres:
    image: postgres:17-alpine
    container_name: statistics-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - statistics_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network
    restart: unless-stopped

  statistics-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: statistics-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - statistics_pgadmin_data:/var/lib/pgadmin
    depends_on:
      statistics-postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  statistics_postgres_data:
  statistics_pgadmin_data:
